<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
<title id="title">Sandalwood sacred arts emblem</title>
<desc id="desc">A warm sandalwood emblem combining a lotus mandala, prayer beads, a living diya flame, rising incense smoke and an open scripture.</desc>
<defs>
  <radialGradient id="bg" cx="48%" cy="35%" r="75%">
    <stop offset="0" stop-color="#fff4dc"/>
    <stop offset=".58" stop-color="#efd6a0"/>
    <stop offset="1" stop-color="#cfa35e"/>
  </radialGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E8C99D"/>
    <stop offset=".42" stop-color="#B98250"/>
    <stop offset="1" stop-color="#70402A"/>
  </linearGradient>
  <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F1D6A8"/>
    <stop offset=".38" stop-color="#B8793F"/>
    <stop offset="1" stop-color="#6D3824"/>
  </linearGradient>
  <linearGradient id="saffron" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#A94E25"/>
    <stop offset=".52" stop-color="#D98535"/>
    <stop offset="1" stop-color="#F5C879"/>
  </linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFF8E9"/>
    <stop offset="1" stop-color="#E8D0AA"/>
  </linearGradient>
  <radialGradient id="aura">
    <stop offset="0" stop-color="#E8A34D" stop-opacity=".42"/>
    <stop offset="1" stop-color="#E8A34D" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="smokeFade" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity=".72"/>
    <stop offset=".45" stop-color="#fff" stop-opacity=".38"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="smokeMask" maskUnits="userSpaceOnUse" x="270" y="38" width="105" height="245">
    <rect x="270" y="38" width="105" height="245" fill="url(#smokeFade)"/>
  </mask>
  <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
  <filter id="smokeSoft" x="-50%" y="-40%" width="200%" height="190%">
    <feGaussianBlur stdDeviation="3.2"/>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
    <feOffset dy="8"/>
    <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <!-- Purpose-drawn lotus petals. Each has its own silhouette and controlled overlap. -->
  <linearGradient id="petalFill" x1="0" y1="1" x2="0.8" y2="0">
    <stop offset="0" stop-color="#9B6844" stop-opacity=".22"/>
    <stop offset=".55" stop-color="#D7AE7C" stop-opacity=".32"/>
    <stop offset="1" stop-color="#F3DDB8" stop-opacity=".72"/>
  </linearGradient>
  <linearGradient id="petalInner" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#B47A4D" stop-opacity=".18"/>
    <stop offset="1" stop-color="#F7E5C7" stop-opacity=".78"/>
  </linearGradient>
  <g id="bead">
    <circle cx="0" cy="-224" r="8.2" fill="url(#bronze)" stroke="#70452D" stroke-width="1.4"/>
    <circle cx="-2.4" cy="-227" r="2.1" fill="#FFF2D9" opacity=".8"/>
  </g>
  <style>
    .mandala-rotate { transform-origin:320px 292px; animation: mandalaTurn 90s linear infinite; }
    .bead-orbit { transform-box:fill-box; transform-origin:50% 50%; animation: beadTurn 150s linear infinite; }
    .petal-breathe { transform-box:fill-box; transform-origin:center; animation: petalBreath 9s ease-in-out infinite; }
    .flame-live { transform-origin:320px 344px; animation: flameFlicker 2.7s ease-in-out infinite; }
    .flame-core { transform-origin:320px 346px; animation: coreFlicker 1.9s ease-in-out infinite; }
    .aura-breathe { transform-origin:320px 320px; animation: auraPulse 4.5s ease-in-out infinite; }
    .smoke-a { transform-origin:320px 270px; animation: smokeSway 8.5s ease-in-out infinite; }
    .smoke-b { transform-origin:320px 270px; animation: smokeSwayBack 11s ease-in-out infinite; }
    .smoke-trace { stroke-dasharray: 8 13; animation: smokeFlow 6s linear infinite; }
    .spark { transform-box:fill-box; transform-origin:center; animation: sparkPulse 3.4s ease-in-out infinite; }
    @keyframes mandalaTurn { to { transform:rotate(360deg); } }
    @keyframes beadTurn { to { transform:rotate(-360deg); } }
    @keyframes petalBreath { 0%,100% { opacity:.94; } 50% { opacity:1; } }
    @keyframes flameFlicker {
      0%,100% { transform:rotate(0deg) scale(1,1); }
      22% { transform:rotate(-1.8deg) scale(.985,1.035); }
      48% { transform:rotate(1.2deg) scale(1.025,.98); }
      73% { transform:rotate(-.8deg) scale(.99,1.025); }
    }
    @keyframes coreFlicker { 0%,100% { transform:scale(1); opacity:.94; } 50% { transform:scale(.94,1.06); opacity:1; } }
    @keyframes auraPulse { 0%,100% { transform:scale(.96); opacity:.72; } 50% { transform:scale(1.08); opacity:1; } }
    @keyframes smokeSway {
      0%,100% { transform:translateX(0) rotate(0deg); }
      28% { transform:translateX(5px) rotate(1deg); }
      64% { transform:translateX(-4px) rotate(-.8deg); }
    }
    @keyframes smokeSwayBack {
      0%,100% { transform:translateX(0) rotate(0deg); }
      36% { transform:translateX(-5px) rotate(-1deg); }
      72% { transform:translateX(3px) rotate(.6deg); }
    }
    @keyframes smokeFlow { to { stroke-dashoffset:-126; } }
    @keyframes sparkPulse { 0%,100% { opacity:.38; transform:scale(.8); } 50% { opacity:.95; transform:scale(1.15); } }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { animation:none !important; }
    }
  </style>
</defs>

<!-- Sandalwood medallion -->
<rect x="10" y="10" width="620" height="620" rx="142" fill="url(#bg)"/>
<rect x="17" y="17" width="606" height="606" rx="136" fill="none" stroke="#FFF6E6" stroke-width="2" opacity=".72"/>
<circle cx="320" cy="292" r="270" fill="none" stroke="#93633F" stroke-width="1.4" opacity=".28"/>
<circle cx="320" cy="292" r="252" fill="none" stroke="#A8794D" stroke-width="1.2" stroke-dasharray="2 10" opacity=".48"/>

<!-- Prayer-bead halo: quiet, tactile, not ornamental clutter -->
<g transform="translate(320 292)">
  <g class="bead-orbit">
    <circle cx="0" cy="0" r="224" fill="none" stroke="#986B45" stroke-width="1.2" opacity=".36"/>
    <use href="#bead"/>
    <use href="#bead" transform="rotate(22.5)"/>
    <use href="#bead" transform="rotate(45)"/>
    <use href="#bead" transform="rotate(67.5)"/>
    <use href="#bead" transform="rotate(90)"/>
    <use href="#bead" transform="rotate(112.5)"/>
    <use href="#bead" transform="rotate(135)"/>
    <use href="#bead" transform="rotate(157.5)"/>
    <use href="#bead" transform="rotate(180)"/>
    <use href="#bead" transform="rotate(202.5)"/>
    <use href="#bead" transform="rotate(225)"/>
    <use href="#bead" transform="rotate(247.5)"/>
    <use href="#bead" transform="rotate(270)"/>
    <use href="#bead" transform="rotate(292.5)"/>
    <use href="#bead" transform="rotate(315)"/>
    <use href="#bead" transform="rotate(337.5)"/>
  </g>
</g>

<!-- Full lotus bloom: rounded, layered petals with a clean radial rhythm -->
<g opacity=".48" fill="none" stroke="#986B45" stroke-width="1.1">
  <circle cx="320" cy="292" r="188" opacity=".42"/>
  <circle cx="320" cy="292" r="164" stroke-dasharray="2 9" opacity=".36"/>
</g>

<defs>
  <linearGradient id="outerPetal" x1="0" y1="1" x2="0.2" y2="0">
    <stop offset="0" stop-color="#98633F" stop-opacity=".24"/>
    <stop offset=".52" stop-color="#D5AD7D" stop-opacity=".38"/>
    <stop offset="1" stop-color="#F8E9D0" stop-opacity=".82"/>
  </linearGradient>
  <linearGradient id="innerPetal" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#A96F45" stop-opacity=".30"/>
    <stop offset="1" stop-color="#F7E5C8" stop-opacity=".90"/>
  </linearGradient>
  <!-- Rounded petal silhouettes avoid the sharp star-like look of pointed mandala blades. -->
  <path id="outerLotusPetal" d="M0 20 C-24 8 -43 -19 -41 -52 C-39 -86 -16 -119 0 -137 C16 -119 39 -86 41 -52 C43 -19 24 8 0 20Z"/>
  <path id="innerLotusPetal" d="M0 13 C-17 3 -29 -18 -28 -43 C-27 -68 -10 -91 0 -105 C10 -91 27 -68 28 -43 C29 -18 17 3 0 13Z"/>
  <path id="heartPetal" d="M0 8 C-12 -1 -19 -17 -17 -32 C-15 -47 -6 -61 0 -70 C6 -61 15 -47 17 -32 C19 -17 12 -1 0 8Z"/>
</defs>

<g class="petal-breathe" transform="translate(320 292)" stroke-linejoin="round" stroke-linecap="round">
  <!-- Eight outer petals form the full flower. Their broad shoulders overlap softly. -->
  <g fill="url(#outerPetal)" stroke="#98633F" stroke-width="1.45" stroke-opacity=".72">
    <use href="#outerLotusPetal"/>
    <use href="#outerLotusPetal" transform="rotate(45)"/>
    <use href="#outerLotusPetal" transform="rotate(90)"/>
    <use href="#outerLotusPetal" transform="rotate(135)"/>
    <use href="#outerLotusPetal" transform="rotate(180)"/>
    <use href="#outerLotusPetal" transform="rotate(225)"/>
    <use href="#outerLotusPetal" transform="rotate(270)"/>
    <use href="#outerLotusPetal" transform="rotate(315)"/>
  </g>

  <!-- Eight inner petals are shorter and offset, creating depth without clutter. -->
  <g fill="url(#innerPetal)" stroke="#A8754A" stroke-width="1.2" stroke-opacity=".62">
    <use href="#innerLotusPetal" transform="rotate(22.5)"/>
    <use href="#innerLotusPetal" transform="rotate(67.5)"/>
    <use href="#innerLotusPetal" transform="rotate(112.5)"/>
    <use href="#innerLotusPetal" transform="rotate(157.5)"/>
    <use href="#innerLotusPetal" transform="rotate(202.5)"/>
    <use href="#innerLotusPetal" transform="rotate(247.5)"/>
    <use href="#innerLotusPetal" transform="rotate(292.5)"/>
    <use href="#innerLotusPetal" transform="rotate(337.5)"/>
  </g>

  <!-- Restrained engraved midribs: only on the outer ring, never crossing petal edges. -->
  <g fill="none" stroke="#98633F" stroke-width="1" opacity=".48">
    <path d="M0 7 C-5 -29 -8 -78 0 -125"/>
    <path d="M0 7 C-5 -29 -8 -78 0 -125" transform="rotate(45)"/>
    <path d="M0 7 C-5 -29 -8 -78 0 -125" transform="rotate(90)"/>
    <path d="M0 7 C-5 -29 -8 -78 0 -125" transform="rotate(135)"/>
    <path d="M0 7 C-5 -29 -8 -78 0 -125" transform="rotate(180)"/>
    <path d="M0 7 C-5 -29 -8 -78 0 -125" transform="rotate(225)"/>
    <path d="M0 7 C-5 -29 -8 -78 0 -125" transform="rotate(270)"/>
    <path d="M0 7 C-5 -29 -8 -78 0 -125" transform="rotate(315)"/>
  </g>

  <!-- Raised floral heart neatly conceals all petal roots. -->
  <circle r="34" fill="#C99A68" stroke="#875638" stroke-width="1.8"/>
  <circle r="27" fill="none" stroke="#F3DDBB" stroke-width="1.3" opacity=".9"/>
  <g fill="url(#innerPetal)" stroke="#98633F" stroke-width="1.05">
    <use href="#heartPetal"/>
    <use href="#heartPetal" transform="rotate(60)"/>
    <use href="#heartPetal" transform="rotate(120)"/>
    <use href="#heartPetal" transform="rotate(180)"/>
    <use href="#heartPetal" transform="rotate(240)"/>
    <use href="#heartPetal" transform="rotate(300)"/>
  </g>
  <circle r="6.5" fill="#895A3A" stroke="#F4DDBB" stroke-width="1.7"/>
</g>

<!-- Ambient light behind the diya -->
<circle class="aura-breathe" cx="320" cy="320" r="112" fill="url(#aura)" filter="url(#softGlow)"/>

<!-- Incense smoke: a fine, asymmetrical plume that diffuses upward -->
<g mask="url(#smokeMask)" fill="none" stroke-linecap="round">
  <g class="smoke-a" filter="url(#smokeSoft)" opacity=".34" stroke="#8C806E">
    <path d="M320 252 C314 237 327 225 320 211 C311 194 296 186 304 169 C312 153 333 147 330 129 C327 111 311 101 319 84 C325 70 335 62 329 48" stroke-width="13"/>
    <path d="M320 252 C329 239 320 226 331 211 C342 196 351 185 341 169 C332 154 317 145 324 129 C332 112 348 103 341 87" stroke-width="9"/>
  </g>
  <g class="smoke-b" stroke="#8D7B66" opacity=".58">
    <path d="M320 253 C311 239 319 226 312 214 C302 197 292 190 301 176 C309 163 326 157 323 143 C320 129 306 120 313 107 C320 94 333 88 328 74 C325 65 321 59 324 51" stroke-width="5.2"/>
    <path d="M320 253 C329 239 323 228 334 216 C344 204 349 194 341 182 C333 169 321 163 327 150 C333 137 344 129 339 116" stroke-width="3.2"/>
  </g>
  <g stroke="#F8E9D2" opacity=".72">
    <path class="smoke-trace" d="M320 252 C312 235 323 221 314 205 C305 189 301 178 313 163 C324 148 333 137 326 122 C319 108 315 98 324 84 C330 75 331 64 326 54" stroke-width="2"/>
  </g>
</g>

<!-- Flame halo and flame -->
<circle cx="320" cy="310" r="58" fill="url(#aura)" opacity=".42"/>
<g class="flame-live">
  <path d="M320 348 C289 320 298 286 320 245 C342 286 351 320 320 348Z" fill="url(#saffron)" stroke="#9D542B" stroke-width="1.5"/>
  <path class="flame-core" d="M320 341 C304 319 309 295 320 274 C332 296 336 319 320 341Z" fill="#FFF4D8"/>
  <path d="M320 336 C315 324 316 310 320 300 C325 313 325 325 320 336Z" fill="#F2C46F" opacity=".9"/>
</g>

<!-- Diya bowl, carved sandalwood/bronze -->
<g filter="url(#shadow)">
  <path d="M205 365 Q257 383 320 356 Q383 383 435 365 C419 424 375 451 320 451 C265 451 221 424 205 365Z" fill="url(#wood)" stroke="#70432D" stroke-width="2.5"/>
  <path d="M218 369 Q268 390 320 370 Q372 390 422 369" fill="none" stroke="#F4D7AA" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  <path d="M247 414 Q320 443 393 414" fill="none" stroke="#F1D5AC" stroke-width="2" stroke-dasharray="3 8" opacity=".55"/>
  <path d="M269 448 Q320 462 371 448 L357 466 Q320 480 283 466Z" fill="#8A5638" stroke="#70432D" stroke-width="1.5"/>
</g>

<!-- Open scripture: two pages form the emblem's foundation -->
<g filter="url(#shadow)">
  <path d="M145 469 Q231 463 320 505 Q409 463 495 469 L486 535 Q405 526 320 558 Q235 526 154 535Z" fill="url(#paper)" stroke="#8B5A39" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M320 505V557" stroke="#A8784D" stroke-width="2"/>
  <path d="M174 487 Q242 488 299 516 M174 502 Q239 503 297 530 M466 487 Q398 488 341 516 M466 502 Q401 503 343 530" fill="none" stroke="#B68B62" stroke-width="2.2" stroke-linecap="round" opacity=".65"/>
  <path d="M145 469 Q231 463 320 505 Q409 463 495 469" fill="none" stroke="#FFF7E8" stroke-width="3" opacity=".8"/>
</g>

<!-- Small sacred bindu below the book -->
<circle cx="320" cy="581" r="5" fill="#8A5638"/>

</svg>