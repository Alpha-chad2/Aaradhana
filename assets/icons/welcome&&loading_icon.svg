<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sandalwood (Chandan) Background Gradient -->
    <radialGradient id="bg-radial" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFFBF2" />
      <stop offset="55%" stop-color="#F3E2C7" />
      <stop offset="100%" stop-color="#DFC39D" />
    </radialGradient>

    <!-- Rich Temple Gold & Bronze Gradient (High Contrast on Sandalwood) -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#6B2708" />
    </linearGradient>

    <!-- Warm Saffron-Gold Petal Fill -->
    <linearGradient id="gold-soft" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9A3412" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.75" />
    </linearGradient>

    <!-- Bright Inner Lotus Gradient -->
    <linearGradient id="inner-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>

    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Outer Ambient Mandala Petal (Carved Sandalwood Etch) -->
    <path id="ambient-petal" d="M 0,-20 C -38,-90 -55,-155 0,-225 C 55,-155 38,-90 0,-20 Z" fill="none" stroke="#B68D5C" stroke-width="2" opacity="0.5" />

    <!-- Main Ornate Lotus Petal -->
    <g id="main-petal">
      <path d="M 0,0 C -32,-65 -42,-130 0,-185 C 42,-130 32,-65 0,0 Z" fill="url(#gold-soft)" stroke="url(#gold-grad)" stroke-width="3" stroke-linejoin="round" />
      <path d="M 0,-15 C -16,-60 -20,-110 0,-155 C 20,-110 16,-60 0,-15 Z" fill="none" stroke="url(#gold-grad)" stroke-width="1.3" opacity="0.8" />
    </g>

    <!-- Inner Bright Lotus Petal -->
    <path id="inner-petal" d="M 0,0 C -22,-45 -26,-85 0,-120 C 26,-85 22,-45 0,0 Z" fill="url(#inner-gold)" stroke="#6B2708" stroke-width="1.2" opacity="0.95" />

    <style>
      /* Smooth Opening Bloom + Continuous Spin */
      .ring-dash {
        transform-origin: 256px 256px;
        animation: spin-cw 36s linear infinite;
      }
      .layer-ambient {
        animation: bloom-ambient 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                   spin-ccw 45s linear infinite 1.4s;
      }
      .layer-secondary {
        animation: bloom-secondary 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                   spin-ccw 28s linear infinite 1.2s;
      }
      .layer-primary {
        animation: bloom-primary 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                   spin-cw 22s linear infinite 1.1s;
      }
      .layer-inner {
        animation: bloom-inner 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                   spin-ccw 15s linear infinite 0.9s;
      }
      .layer-core {
        animation: core-pulse 2.8s ease-in-out infinite;
      }

      @keyframes bloom-ambient {
        0% { transform: scale(0) rotate(45deg); opacity: 0; }
        100% { transform: scale(1) rotate(0deg); opacity: 1; }
      }
      @keyframes bloom-secondary {
        0% { transform: scale(0) rotate(-60deg); opacity: 0; }
        100% { transform: scale(0.92) rotate(0deg); opacity: 0.65; }
      }
      @keyframes bloom-primary {
        0% { transform: scale(0) rotate(-90deg); opacity: 0; }
        100% { transform: scale(1) rotate(0deg); opacity: 1; }
      }
      @keyframes bloom-inner {
        0% { transform: scale(0) rotate(90deg); opacity: 0; }
        100% { transform: scale(1) rotate(0deg); opacity: 1; }
      }
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes core-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
    </style>
  </defs>

  <!-- The loader supplies this gradient across the full viewport. -->
  <rect width="512" height="512" fill="none" />

  <!-- Outer Decorative Rings -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" opacity="0.35" />
  <circle class="ring-dash" cx="256" cy="256" r="200" fill="none" stroke="#A67B4B" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.6" />

  <g transform="translate(256, 256)">
    <!-- Layer 1: Background Watermark Mandala -->
    <g class="layer-ambient">
      <use href="#ambient-petal" transform="rotate(0)" />
      <use href="#ambient-petal" transform="rotate(22.5)" />
      <use href="#ambient-petal" transform="rotate(45)" />
      <use href="#ambient-petal" transform="rotate(67.5)" />
      <use href="#ambient-petal" transform="rotate(90)" />
      <use href="#ambient-petal" transform="rotate(112.5)" />
      <use href="#ambient-petal" transform="rotate(135)" />
      <use href="#ambient-petal" transform="rotate(157.5)" />
      <use href="#ambient-petal" transform="rotate(180)" />
      <use href="#ambient-petal" transform="rotate(202.5)" />
      <use href="#ambient-petal" transform="rotate(225)" />
      <use href="#ambient-petal" transform="rotate(247.5)" />
      <use href="#ambient-petal" transform="rotate(270)" />
      <use href="#ambient-petal" transform="rotate(292.5)" />
      <use href="#ambient-petal" transform="rotate(315)" />
      <use href="#ambient-petal" transform="rotate(337.5)" />
    </g>

    <!-- Layer 2: Secondary Rotated Lotus -->
    <g class="layer-secondary">
      <use href="#main-petal" transform="rotate(22.5)" />
      <use href="#main-petal" transform="rotate(67.5)" />
      <use href="#main-petal" transform="rotate(112.5)" />
      <use href="#main-petal" transform="rotate(157.5)" />
      <use href="#main-petal" transform="rotate(202.5)" />
      <use href="#main-petal" transform="rotate(247.5)" />
      <use href="#main-petal" transform="rotate(292.5)" />
      <use href="#main-petal" transform="rotate(337.5)" />
    </g>

    <!-- Layer 3: Primary Golden Lotus -->
    <g class="layer-primary">
      <use href="#main-petal" transform="rotate(0)" />
      <use href="#main-petal" transform="rotate(45)" />
      <use href="#main-petal" transform="rotate(90)" />
      <use href="#main-petal" transform="rotate(135)" />
      <use href="#main-petal" transform="rotate(180)" />
      <use href="#main-petal" transform="rotate(225)" />
      <use href="#main-petal" transform="rotate(270)" />
      <use href="#main-petal" transform="rotate(315)" />
    </g>

    <!-- Layer 4: Inner Solid Lotus Petals -->
    <g class="layer-inner">
      <use href="#inner-petal" transform="rotate(22.5)" />
      <use href="#inner-petal" transform="rotate(67.5)" />
      <use href="#inner-petal" transform="rotate(112.5)" />
      <use href="#inner-petal" transform="rotate(157.5)" />
      <use href="#inner-petal" transform="rotate(202.5)" />
      <use href="#inner-petal" transform="rotate(247.5)" />
      <use href="#inner-petal" transform="rotate(292.5)" />
      <use href="#inner-petal" transform="rotate(337.5)" />
    </g>

    <!-- Layer 5: Center Sacred Core / Bindu (Deep Sandalwood & Kumkum Accent) -->
    <g class="layer-core" filter="url(#gold-glow)">
      <circle cx="0" cy="0" r="42" fill="#5A270B" stroke="url(#inner-gold)" stroke-width="3" />
      <circle cx="0" cy="0" r="32" fill="url(#inner-gold)" />
      <path d="M 0,-22 Q 0,0 22,0 Q 0,0 0,22 Q 0,0 -22,0 Q 0,0 0,-22 Z" fill="#5A270B" />
      <circle cx="0" cy="0" r="5" fill="#FFFBF2" />
    </g>
  </g>
</svg>