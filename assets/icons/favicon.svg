  <ellipse cx="16" cy="22.5" rx="8.5" ry="1.8" fill="#fef3c7" opacity="0.4" />
  <!-- Outer flame -->
  <path d="M16 5 C12 11 9 14 9 18 C9 21.5 12 23 16 23 C20 23 23 21.5 23 18 C23 14 20 11 16 5 Z" fill="url(#flameGrad)" />
  <!-- Inner core flame -->
  <path d="M16 12 C14 15 12.5 17 12.5 19 C12.5 21 14 22 16 22 C18 22 19.5 21 19.5 19 C19.5 17 18 15 16 12 Z" fill="url(#innerFlame)" />
