<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="mantra-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#112656" />
      <stop offset="100%" stop-color="#07112b" />
    </radialGradient>
    <linearGradient id="mantra-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <!-- Single Mala Bead Definition -->
    <g id="mala-bead">
      <circle cx="0" cy="-148" r="14" fill="url(#mantra-gold)" stroke="#07112b" stroke-width="2" />
      <circle cx="-4" cy="-152" r="3.5" fill="#FFF8EB" opacity="0.65" />
    </g>
  </defs>

  <!-- Background & Outer Rings -->
  <rect width="512" height="512" rx="112" fill="url(#mantra-bg)" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#mantra-gold)" stroke-width="1.5" opacity="0.25" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="#254385" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.5" />

  <g transform="translate(256, 240)">
    <!-- Mala Thread -->
    <circle cx="0" cy="0" r="148" fill="none" stroke="url(#mantra-gold)" stroke-width="2.5" opacity="0.6" />

    <!-- 16 Japa Mala Beads -->
    <use href="#mala-bead" transform="rotate(0)" />
    <use href="#mala-bead" transform="rotate(22.5)" />
    <use href="#mala-bead" transform="rotate(45)" />
    <use href="#mala-bead" transform="rotate(67.5)" />
    <use href="#mala-bead" transform="rotate(90)" />
    <use href="#mala-bead" transform="rotate(112.5)" />
    <use href="#mala-bead" transform="rotate(135)" />
    <use href="#mala-bead" transform="rotate(157.5)" />
    <use href="#mala-bead" transform="rotate(202.5)" />
    <use href="#mala-bead" transform="rotate(225)" />
    <use href="#mala-bead" transform="rotate(247.5)" />
    <use href="#mala-bead" transform="rotate(270)" />
    <use href="#mala-bead" transform="rotate(292.5)" />
    <use href="#mala-bead" transform="rotate(315)" />
    <use href="#mala-bead" transform="rotate(337.5)" />

    <!-- Bottom Guru / Meru Bead & Tassel -->
    <circle cx="0" cy="150" r="18" fill="url(#mantra-gold)" stroke="#FFF8EB" stroke-width="2" />
    <path d="M -6,166 L 6,166 L 16,205 C 5,212 -5,212 -16,205 Z" fill="url(#mantra-gold)" />
    <line x1="0" y1="168" x2="0" y2="206" stroke="#07112b" stroke-width="2" opacity="0.6" />

    <!-- Sound / Chanting Vibration Waves -->
    <circle cx="0" cy="0" r="108" fill="none" stroke="url(#mantra-gold)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />
    <circle cx="0" cy="0" r="82" fill="none" stroke="url(#mantra-gold)" stroke-width="2.5" opacity="0.85" />

    <!-- Sacred Geometric Yantra Star (Shatkona) -->
    <polygon points="0,-64 55,32 -55,32" fill="none" stroke="url(#mantra-gold)" stroke-width="3" stroke-linejoin="round" />
    <polygon points="0,64 55,-32 -55,-32" fill="none" stroke="url(#mantra-gold)" stroke-width="3" stroke-linejoin="round" />

    <!-- Inner Bindu (Focal Point of Mantra) -->
    <circle cx="0" cy="0" r="24" fill="#07112b" stroke="url(#mantra-gold)" stroke-width="2.5" />
    <path d="M 0,-15 Q 0,0 15,0 Q 0,0 0,15 Q 0,0 -15,0 Q 0,0 0,-15 Z" fill="url(#mantra-gold)" />
    <circle cx="0" cy="0" r="4" fill="#FFF8EB" />
  </g>
</svg>